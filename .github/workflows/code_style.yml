name: Check code style
on:
  push:
    branches:
      - main
      - feature/ci_setup
  pull_request:

jobs:
  check-code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Check webview code style
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :webview:ktlintCheck --stacktrace --console=plain 2>&1 | tee ktlint.log
      - name: Upload ktlint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-log
          path: ktlint.log
          if-no-files-found: ignore
