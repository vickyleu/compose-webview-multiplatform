name: Check code style
on:
  push:
    branches:
      - main
      - feature/ci_setup
  pull_request:

jobs:
  check-code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Check webview code style
        shell: bash
        run: ./gradlew :webview:ktlintCheck
