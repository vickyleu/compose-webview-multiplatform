name: Build Multiplatform project
on:
  push:
    branches:
      - main
      - feature/ci_setup
  pull_request:

jobs:
  build-multiplatform-project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macOS-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Build Multiplatform project
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx6G -XX:MaxMetaspaceSize=1024m"
        run: |
          set -o pipefail
          ./gradlew assemble --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-${{ matrix.os }}
          path: gradle-build.log
          if-no-files-found: ignore
