#Gradle
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx6048M"
# Turn on parallel compilation and caching. Configuration on demand is disabled because wasmJs does not support it.
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official

#MPP
#kotlin.mpp.stability.nowarn=true
#kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true

#Development
development=true


#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Enable R8 full mode.
android.enableR8.fullMode=true
